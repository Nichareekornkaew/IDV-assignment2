<!DOCTYPE html>

        <style>
            /* Assignment 001 - Hover */
            body {
                font-family: Arial, sans-serif;
            }

            .topic-box {
                transition: opacity 0.2s ease;
            }

            .topic-box:hover {
                opacity: 0.3;
                cursor: pointer;
            }

            /* Assignment 002 - Node Hover */
            .heap-node {
                transition: fill 0.2s ease;
            }

            .heap-node:hover {
                fill: #99B3FF;
                cursor: pointer;
            }

            /* Assignment 014 - Plot Hover */
            .hierarchy-box {
                transition: opacity 0.2s ease;
                cursor: pointer;
            }

            .hierarchy-box:hover {
                opacity: 0.3;
            }

            /* Assignment 010 - Vertex Hover */
            .graph-vertex {
                fill: white;
                transition: fill 0.2s ease;
            }

            .graph-vertex:hover {
                fill: #FF99D6;
                cursor: pointer;
            }

            #graph-vertices text {
                pointer-events: none;
            }

            /* Assignment 011 - Ellipse Hover */
            .topological-node {
                fill: white;
                transition: fill 0.2s ease;
            }

            .topological-node:hover {
                fill: #FFE099;
                cursor: pointer;
            }

            /* Assignment 011 - Allow mouse hover through text */
            #topological-nodes text {
                pointer-events: none;
            }           
            
            /* Assignment 017 - Curve Hover */
            #sigmoid-path {
                transition: stroke 0.2s ease, stroke-width 0.2s ease;
            }

            #sigmoid-path:hover {
                stroke: #E89143;
                stroke-width: 4;
                cursor: crosshair;
            }
        </style>
    </head>

        <script>
            // Wait until the page is loaded
            document.addEventListener("DOMContentLoaded", function () {

                // 1. Select the SVG path
                const path = document.getElementById("sigmoid-path");

                // 2. Graph area (must match your axes)
                const left = 80;
                const right = 780;
                const top = 50;
                const bottom = 450;

                // 3. Data range
                const xMin = -10;
                const xMax = 10;
                const yMin = 0;
                const yMax = 1;

                // 4. Number of sample points
                const numPoints = 200;

                // 5. Sigmoid function
                function sigmoid(x) {
                return 1 / (1 + Math.exp(-x));
                }

                // 6. Convert data x to SVG x
                function mapX(x) {
                return left + ((x - xMin) / (xMax - xMin)) * (right - left);
                }

                // 7. Convert data y to SVG y
                function mapY(y) {
                return bottom - ((y - yMin) / (yMax - yMin)) * (bottom - top);
                }

                // 8. Build SVG path string
                let d = "";

                for (let i = 0; i <= numPoints; i++) {
                const x = xMin + (i / numPoints) * (xMax - xMin);
                const y = sigmoid(x);

                const svgX = mapX(x);
                const svgY = mapY(y);

                if (i === 0) {
                    d += `M ${svgX} ${svgY}`;
                } else {
                    d += ` L ${svgX} ${svgY}`;
                }
                }

                // 9. Apply the path
                path.setAttribute("d", d);
                });
        </script>
