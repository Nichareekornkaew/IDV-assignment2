<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <title>SVG Practice</title>

        <style>
            body {
                font-family: Arial, sans-serif;
            }

            .topic-box {
                transition: opacity 0.2s ease;
            }

            .topic-box:hover {
                opacity: 0.3;
                cursor: pointer;
            }
        </style>
    </head>

    <body>
        <h1>SVG Assignment</h1>
        <section>
            <h2>SVG Practice 001</h2>

            <!--Drawing area for SVG -->
            <svg width="900"
                    height="450"
                    viewBox="0 0 900 450"
                    style="font-family: Arial, sans-serif;">


            <!--arrowhead definition-->        
            <defs>
                <marker id="my-arrow"
                        viewBox="0 0 10 10"
                        refX="9"
                        refY="5"
                        markerWidth="6"
                        markerHeight="6"
                        orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z"
                            fill="black" />
                </marker>
            </defs>

            <!--Diagonal connecting arrow-->
            <g id="Diagonal-arrows">
                <line x1="440" y1="105"
                    x2="140" y2="190"
                    stroke="black"
                    stroke-width="2" 
                    marker-end="url(#my-arrow)" />

                <line x1="460" y1="105"
                    x2="360" y2="190"
                    stroke="black"
                    stroke-width="2"
                    marker-end="url(#my-arrow)" />

                <line x1="480" y1="105"
                    x2="580" y2="190"
                    stroke="black"
                    stroke-width="2"
                    marker-end="url(#my-arrow)" />

                <line x1="500" y1="105"
                    x2="800" y2="190"
                    stroke="black"
                    stroke-width="2"
                    marker-end="url(#my-arrow)" />
            </g>
                    
            <!--Connecting line1--> 
            <g id="Connecting-lines">
                <line x1="140" y1="250"
                    x2="140" y2="310"
                    stroke="black"
                    stroke-width="2" 
                    marker-end="url(#my-arrow)" />

                <!--Connecting line2-->
                <line x1="360" y1="250"
                    x2="360" y2="310"
                    stroke="black"
                    stroke-width="2" 
                    marker-end="url(#my-arrow)" />
            
                <!--Connecting line3-->
                <line x1="580" y1="250"
                    x2="580" y2="310"
                    stroke="black"
                    stroke-width="2" 
                    marker-end="url(#my-arrow)" />

                <!--Connecting line4-->
                <line x1="800" y1="250"
                    x2="800" y2="310"
                    stroke="black"
                    stroke-width="2" 
                    marker-end="url(#my-arrow)" />
            </g>

        <!--Main Topic -->
        <g id="main-topic">
            <!--Connecting label-->
            <text x="470"
                    y="145"
                    text-anchor="middle"
                    font-size="15"
                    fill="black">
                learns
            </text>

            <rect x="380"
                    y="40"
                    width="180"
                    height="65"
                    rx="20"
                    fill="#DDDDDD" 
                    stroke="#333333"
                    stroke-width="2" />

            <text x="470"
                    y="68"
                    text-anchor="middle"
                    font-size="16"
                    fill="black">
                <tspan x="470" dy="0">Data Driven</tspan>
                <tspan x="470" dy="22">World</tspan>
            </text>
        </g>

        <!--Child box1-->
        <g id="child-box1">
            <rect class="topic-box"
                    x="60"
                    y="190"
                    width="160"
                    height="60"
                    fill="#19dfe3"
                    stroke="#333333"
                    stroke-width="1.5" />

            <text x="140"
                    y="218"
                    text-anchor="middle"
                    font-size="12"
                    fill="black">
                <tspan x="140" dy="0">Algorithms and Data</tspan>
                <tspan x="140" dy="18">Structures</tspan>
            </text>

            <!-- Week box 1 -->
            <rect x="90"
                    y="310"
                    width="100"
                    height="28"
                    fill="white"
                    stroke="#333333"
                    stroke-width="1.5" />

            <text x="140"
                    y="328"
                    text-anchor="middle"
                    font-size="10"
                    fill="black">
                Week 1 to 6
            </text>
        </g>

        <!-- Child box 2 -->
        <g id="child-box2">
            <rect class="topic-box"
                    x="280"
                    y="190"
                    width="160"
                    height="60"
                    fill="#ef7588"
                    stroke="#333333"
                    stroke-width="1.5" />

            <text x="360"
                    y="218"
                    text-anchor="middle"
                    font-size="12"
                    fill="black">
                <tspan x="360" dy="0">Object Oriented</tspan>
                <tspan x="360" dy="18">Programming</tspan>
            </text>

            <!-- Week box 2 -->
            <rect x="310"
                    y="310"
                    width="100"
                    height="28"
                    fill="white"
                    stroke="#333333"
                    stroke-width="1.5" />

            <text x="360"
                    y="328"
                    text-anchor="middle"
                    font-size="10"
                    fill="black">
                Week 4 to 8
            </text>
        </g>

        <!-- Child box 3 -->
        <g id="child-box3">
            <rect class="topic-box"
                    x="500"
                    y="190"
                    width="160"
                    height="60"
                    fill="#f4a259"
                    stroke="#333333"
                    stroke-width="1.5" />

            <text x="580"
                    y="225"
                    text-anchor="middle"
                    font-size="12"
                    fill="black">
                State Machine
            </text>

            <!-- Week box 3 -->
            <rect x="530"
                    y="310"
                    width="100"
                    height="28"
                    fill="white"
                    stroke="#333333"
                    stroke-width="1.5" />

            <text x="580"
                    y="328"
                    text-anchor="middle"
                    font-size="10"
                    fill="black">
                Week 8
            </text>
        </g>

        <!-- Child box 4 -->
        <g id="child-box4">
            <rect class="topic-box"
                    x="720"
                    y="190"
                    width="160"
                    height="60"
                    fill="#7ac943"
                    stroke="#333333"
                    stroke-width="1.5" />
            
            <text x="800"
                    y="218"
                    text-anchor="middle"
                    font-size="12"
                    fill="black">
                <tspan x="800" dy="0">Introduction to</tspan>
                <tspan x="800" dy="18">Machine Learning</tspan>
            </text>

            <!-- Week box 4 -->
            <rect x="750"
                    y="310"
                    width="100"
                    height="28"
                    fill="white"
                    stroke="#333333"
                    stroke-width="1.5" />

            <text x="800"
                    y="328"
                    text-anchor="middle"
                    font-size="10"
                    fill="black">
                Week 9 to 11
            </text>
        </g>

            </svg>
    
        </section>
    </body>
</html>
